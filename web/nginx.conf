server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La web solo habla con la API; la API es la única que habla con los gestores.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /docs { proxy_pass http://api:8000; }
    location /openapi.json { proxy_pass http://api:8000; }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}
